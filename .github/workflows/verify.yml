name: verify

# What this does and does not prove.
#
# It does not rebuild the screen from the four annual reports. Nothing in src/
# reads them: the figures were transcribed once, by hand, against the printed
# page numbers recorded in the source_page_note column of
# data/final/verified_inputs.csv, and the pipeline starts from that CSV. The
# filings themselves are not committed either -- they are third-party
# copyrighted documents, and data/raw/source_manifest.md identifies each one by
# URL, retrieval time and SHA-256 so a reader can obtain and verify it.
#
# What it does check, in order of how much it means:
#
#   1. The balance-sheet tie-outs pass. src/accruals.py reconciles assets against
#      equity plus liabilities for every company-year before it computes an
#      accrual ratio, so a bad extraction stops here.
#   2. The committed artifacts reproduce byte for byte -- the CSVs, the
#      reconciliation log, the dashboard and the Excel screener. None of them
#      depends on the machine, so an exact diff is the right test, and it catches
#      a number edited by hand without rerunning what produces it. The workbook
#      is in that list because its build was made deterministic on purpose; see
#      _make_reproducible in src/build_excel.py.
#   3. The tests pass, including the ones asserting the README, the dashboard and
#      the memo still quote the figures the CSVs actually hold.
#
# Charts and the PDF are rebuilt as a smoke test and deliberately not compared.
# matplotlib renders text differently on Linux than on macOS, so the PNGs differ
# between a correct local build and a correct CI build, and the memo embeds them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: The two records of the source hashes still agree
        # The filings are not in the repository, so there is nothing here to
        # hash. What can still go wrong is the two places that record those
        # hashes drifting apart -- data/raw/SHA256SUMS, which a reader runs
        # shasum against, and the table in data/raw/source_manifest.md, which
        # carries the same hash beside the URL it came from. If someone edits
        # one and forgets the other, a reader gets a false OK. This checks they
        # still describe the same four documents.
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          sums = {}
          for line in Path("data/raw/SHA256SUMS").read_text().splitlines():
              if line.strip():
                  h, name = line.split()
                  sums[name.strip()] = h

          manifest = Path("data/raw/source_manifest.md").read_text()
          rows = dict(re.findall(r"\| (annual_reports/\S+\.pdf) .*?`([0-9a-f]{64})`", manifest))

          if sums != rows:
              for name in sorted(set(sums) | set(rows)):
                  a, b = sums.get(name), rows.get(name)
                  print(("ok   " if a == b else "DIFF ") + name)
                  if a != b:
                      print(f"       SHA256SUMS      {a}")
                      print(f"       source_manifest {b}")
              sys.exit("SHA256SUMS and source_manifest.md disagree")
          print(f"ok: both records list the same {len(sums)} documents and hashes")
          PY

      - name: Reconciliation passes and the screen rebuilds
        run: python src/accruals.py

      - name: Dashboard and workbook rebuild
        run: |
          python src/build_dashboard.py
          python src/build_excel.py

      - name: Committed artifacts reproduce exactly
        run: git diff --exit-code -- data/final data/processed outputs/dashboard

      - name: Committed workbook reproduces
        # Compared entry by entry rather than as bytes, so a failure says which
        # part of the workbook moved instead of "Binary files differ".
        run: |
          git show HEAD:outputs/screener/epc_earnings_quality_screener.xlsx > /tmp/committed.xlsx
          python - <<'PY'
          import sys, zipfile
          a = zipfile.ZipFile("/tmp/committed.xlsx")
          b = zipfile.ZipFile("outputs/screener/epc_earnings_quality_screener.xlsx")
          na = {i.filename for i in a.infolist()}
          nb = {i.filename for i in b.infolist()}
          bad = False
          if na != nb:
              bad = True
              print("entry set differs:", sorted(na ^ nb))
          for n in sorted(na & nb):
              x, y = a.read(n), b.read(n)
              if x != y:
                  bad = True
                  i = next((k for k in range(min(len(x), len(y))) if x[k] != y[k]),
                           min(len(x), len(y)))
                  print(f"DIFFERS: {n} (first difference at byte {i})")
                  print("  committed:", x[max(0, i - 100):i + 100])
                  print("  rebuilt  :", y[max(0, i - 100):i + 100])
          sys.exit(1 if bad else 0)
          PY

      - name: Tests
        run: |
          pip install pytest
          pytest -q

      - name: Charts and memo still build
        run: |
          python src/build_charts.py
          python src/build_pdf.py
